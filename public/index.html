<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101F2C" />
    <meta
      name="description"
      content="SP Law Chamber — Advocates & Legal Consultants. Civil and criminal litigation, writ petitions, corporate, banking, property and tribunal matters across India. Book a free consultation."
    />
    <!-- Default Open Graph / Twitter card. This is a client-rendered SPA, so
         social crawlers see these firm-level defaults for shared links (including
         Legal Insights posts). Per-post previews require an edge/prerender layer
         (tracked separately). usePageMeta also updates og:title/og:description at
         runtime for in-app navigation and JS-capable embedders. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SP Law Chamber" />
    <meta property="og:title" content="SP Law Chamber — Advocates & Legal Consultants" />
    <meta
      property="og:description"
      content="Trusted advocates for civil and criminal litigation, writ petitions, corporate, banking, property and tribunal matters across India."
    />
    <meta property="og:image" content="%PUBLIC_URL%/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SP Law Chamber — Advocates & Legal Consultants" />
    <meta
      name="twitter:description"
      content="Trusted advocates for civil and criminal litigation and legal matters across India."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SP Law Chamber — Advocates & Legal Consultants</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
