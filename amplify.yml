version: 1
backend:
  phases:
    build:
      commands:
        # Deploys the Amplify Gen 2 backend (Cognito, AppSync/DynamoDB, S3,
        # Lambdas) and writes amplify_outputs.json to the repo root.
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # `prebuild` (scripts/sync-amplify-outputs.mjs) copies the root
        # amplify_outputs.json into src/ before react-scripts builds.
        # CI=false so CRA does not treat lint warnings as build errors.
        - CI=false npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
